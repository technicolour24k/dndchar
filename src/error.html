<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>%sveltekit.error.message%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #14161b;
        color: #f4f4f4;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      .error {
        display: flex;
        align-items: center;
        max-width: 32rem;
        margin: 0 1rem;
      }

      .status {
        font-weight: 200;
        font-size: 3rem;
        line-height: 1;
        position: relative;
        top: -0.05rem;
      }

      .message {
        border-left: 1px solid #444;
        padding: 0 0 0 1rem;
        margin: 0 0 0 1rem;
        min-height: 2.5rem;
        display: flex;
        align-items: center;
      }

      .message h1 {
        font-weight: 400;
        font-size: 1em;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="error">
      <span class="status">%sveltekit.status%</span>
      <div class="message">
        <h1>%sveltekit.error.message%</h1>
      </div>
    </div>
  </body>
</html>
